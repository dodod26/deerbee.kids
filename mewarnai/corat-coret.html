<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corat-Coret - DeerBee</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/coloring.css">
<script src="../js/shared.js"></script>
<style>
.draw-wrap{
max-width:520px;
margin:0 auto;
}

/* ===== KANVAS ===== */
.canvas-frame{
position:relative;
background:white;
border-radius:22px;
padding:10px;
max-width:520px;
margin:0 auto 14px;
box-shadow:0 6px 20px rgba(0,0,0,.12);
border:4px dashed #ffd1e3;
touch-action:none;
}

#drawCanvas{
display:block;
width:100%;
border-radius:14px;
cursor:crosshair;
background:white;
touch-action:none;
}

/* ===== PALET ===== */
.palette{
display:flex;
align-items:center;
gap:10px;
max-width:520px;
margin:0 auto 12px;
overflow-x:auto;
overflow-y:hidden;
padding:8px 14px;
-webkit-overflow-scrolling:touch;
}

.palette::-webkit-scrollbar{ height:5px; }
.palette::-webkit-scrollbar-thumb{ background:#ffd1e6; border-radius:10px; }

.color-dot{
flex:0 0 auto;
position:relative;
width:44px;
height:44px;
border-radius:63% 37% 54% 46% / 55% 48% 52% 45%;
border:2.5px solid rgba(0,0,0,.15);
box-shadow:
inset 0 -5px 7px rgba(0,0,0,.22),
inset 0 3px 5px rgba(255,255,255,.55),
0 3px 8px rgba(0,0,0,.18);
cursor:pointer;
transition:.2s;
overflow:hidden;
}

.color-dot::after{
content:'';
position:absolute;
top:14%;
left:18%;
width:42%;
height:32%;
background:rgba(255,255,255,.55);
border-radius:50%;
filter:blur(1.5px);
pointer-events:none;
}

.color-dot.selected{
transform:scale(1.18) rotate(-4deg);
box-shadow:
inset 0 -5px 7px rgba(0,0,0,.22),
inset 0 3px 5px rgba(255,255,255,.55),
0 0 0 3px rgba(255,105,180,.4),
0 3px 8px rgba(0,0,0,.18);
}

/* ===== UKURAN KUAS ===== */
.brush-row{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin-bottom:14px;
}

.brush-btn{
display:flex;
align-items:center;
justify-content:center;
width:52px;
height:52px;
border-radius:14px;
border:3px solid white;
background:white;
box-shadow:0 3px 10px rgba(0,0,0,.12);
cursor:pointer;
transition:.15s;
}

.brush-btn.selected{
border-color:#ff69b4;
background:#fff0f6;
}

.brush-btn .dot{
background:#333;
border-radius:50%;
}

.brush-btn.eraser-btn{
font-size:22px;
}

.brush-btn.eraser-btn.selected{
border-color:#7ec8f2;
background:#f0f8ff;
}

/* ===== TOMBOL AKSI ===== */
.action-buttons{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.action-buttons button{
background:none;
border:none;
padding:0;
cursor:pointer;
line-height:0;
transition:.15s;
}

.action-buttons button img{
width:70px;
height:auto;
display:block;
filter:drop-shadow(0 3px 5px rgba(0,0,0,.15));
}

.action-buttons button:hover{
transform:translateY(-2px);
}

.action-buttons button:active{ transform:scale(0.92); }

/* Simpan belum ada gambar 3D-nya, jadi tetap kartu bulat pastel biar senada */
#btnSave{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
width:70px;
height:70px;
border-radius:18px;
background:#e8f5e9;
color:#27500a;
font-family:'Baloo 2','Arial',sans-serif;
font-size:10px;
font-weight:700;
}

#btnSave .btn-ico{ font-size:24px; line-height:1; display:block; }

.btn-back-icon{
display:block;
width:110px;
margin:0 auto 18px;
transition:.2s;
}

.btn-back-icon img{
width:100%;
display:block;
filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));
}

.btn-back-icon:hover{ transform:translateY(-3px); }
.btn-back-icon:active{ transform:scale(0.95); }

/* Kursor preview */
#cursorPreview{
position:fixed;
pointer-events:none;
border-radius:50%;
border:2px solid rgba(0,0,0,.3);
transform:translate(-50%,-50%);
z-index:999;
display:none;
mix-blend-mode:multiply;
}
</style>
</head>
<body>

<div class="draw-wrap">

<h1>🖌️ Corat-Coret Bebas</h1>
<p class="page-subtitle">Gambar apa aja yang kamu suka!</p>

<!-- KANVAS -->
<div class="canvas-frame">
<canvas id="drawCanvas"></canvas>
</div>

<!-- PALET WARNA -->
<div class="palette" id="palette">
<div class="color-dot selected" style="background:#000000" data-color="#000000"></div>
<div class="color-dot" style="background:#ff5c5c" data-color="#ff5c5c"></div>
<div class="color-dot" style="background:#ff914d" data-color="#ff914d"></div>
<div class="color-dot" style="background:#ffe066" data-color="#ffe066"></div>
<div class="color-dot" style="background:#ffc94d" data-color="#ffc94d"></div>
<div class="color-dot" style="background:#ffb347" data-color="#ffb347"></div>
<div class="color-dot" style="background:#ff8fb3" data-color="#ff8fb3"></div>
<div class="color-dot" style="background:#ff69b4" data-color="#ff69b4"></div>
<div class="color-dot" style="background:#ffd1e6" data-color="#ffd1e6"></div>
<div class="color-dot" style="background:#e066ff" data-color="#e066ff"></div>
<div class="color-dot" style="background:#caa6ff" data-color="#caa6ff"></div>
<div class="color-dot" style="background:#9b8cff" data-color="#9b8cff"></div>
<div class="color-dot" style="background:#5c7cff" data-color="#5c7cff"></div>
<div class="color-dot" style="background:#7ec8f2" data-color="#7ec8f2"></div>
<div class="color-dot" style="background:#5ec9e0" data-color="#5ec9e0"></div>
<div class="color-dot" style="background:#4dd0c4" data-color="#4dd0c4"></div>
<div class="color-dot" style="background:#9be7a3" data-color="#9be7a3"></div>
<div class="color-dot" style="background:#6fcf6f" data-color="#6fcf6f"></div>
<div class="color-dot" style="background:#4caf50" data-color="#4caf50"></div>
<div class="color-dot" style="background:#c9e066" data-color="#c9e066"></div>
<div class="color-dot" style="background:#a9714c" data-color="#a9714c"></div>
<div class="color-dot" style="background:#7a4a2b" data-color="#7a4a2b"></div>
<div class="color-dot" style="background:#888888" data-color="#888888"></div>
<div class="color-dot" style="background:#dddddd" data-color="#dddddd"></div>
<div class="color-dot" style="background:#ffffff;border-color:#ccc" data-color="#ffffff"></div>
</div>

<!-- UKURAN KUAS -->
<div class="brush-row">
<div class="brush-btn selected" data-size="4" onclick="selectBrush(4,this)">
<span class="dot" style="width:8px;height:8px;"></span>
</div>
<div class="brush-btn" data-size="12" onclick="selectBrush(12,this)">
<span class="dot" style="width:16px;height:16px;"></span>
</div>
<div class="brush-btn" data-size="28" onclick="selectBrush(28,this)">
<span class="dot" style="width:28px;height:28px;"></span>
</div>
<div class="brush-btn eraser-btn" data-size="28" onclick="toggleEraser(this)">
🧹
</div>
</div>

<!-- TOMBOL AKSI -->
<div class="action-buttons">
<button id="btnUndo" onclick="undoDraw()">
<img src="../assets/icons/btn-undo.png" alt="Undo">
</button>
<button id="btnReset" onclick="resetCanvas()">
<img src="../assets/icons/btn-reset.png" alt="Hapus">
</button>
<button id="btnSave" onclick="saveDrawing()">
<span class="btn-ico">💾</span>Simpan
</button>
<button id="btnDone" onclick="onDone()">
<img src="../assets/icons/btn-selesai.png" alt="Selesai">
</button>
</div>

<a class="btn-back-icon" href="../mewarnai.html">
<img src="../assets/icons/btn-back.png" alt="Kembali">
</a>

</div>

<div class="confetti-layer" id="confetti"></div>
<div id="cursorPreview"></div>

<audio id="bgMusic" src="../assets/musik/bgm.mp3" loop></audio>
<button id="musicToggle" onclick="toggleMusic()">🔇</button>

<script>
/* ===== SETUP CANVAS ===== */
const canvas = document.getElementById('drawCanvas');
const ctx    = canvas.getContext('2d');
const frame  = canvas.parentElement;

function resizeCanvas(){
const w = frame.clientWidth - 20;
canvas.width  = w;
canvas.height = Math.round(w * 0.85);
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);
redrawFromHistory();
}

window.addEventListener('resize', ()=>{
const prev = ctx.getImageData(0, 0, canvas.width, canvas.height);
resizeCanvas();
// restore
ctx.putImageData(prev, 0, 0);
});

/* ===== STATE ===== */
let currentColor = '#000000';
let brushSize    = 4;
let isEraser     = false;
let isDrawing    = false;
let lastX = 0, lastY = 0;
let history      = [];
const MAX_HISTORY = 20;

function saveHistory(){
if(history.length >= MAX_HISTORY) history.shift();
history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
}

function redrawFromHistory(){
if(history.length > 0){
ctx.putImageData(history[history.length-1], 0, 0);
} else {
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);
}
}

/* ===== WARNA ===== */
document.querySelectorAll('.color-dot').forEach(dot=>{
dot.addEventListener('click', ()=>{
document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected'));
dot.classList.add('selected');
currentColor = dot.dataset.color;
isEraser = false;
document.querySelectorAll('.brush-btn.eraser-btn').forEach(b=>b.classList.remove('selected'));
updateCursorPreview();
});
});

/* ===== KUAS ===== */
const brushBtns = document.querySelectorAll('.brush-btn:not(.eraser-btn)');
function selectBrush(size, el){
brushSize = size;
brushBtns.forEach(b=>b.classList.remove('selected'));
el.classList.add('selected');
updateCursorPreview();
}

function toggleEraser(el){
isEraser = !isEraser;
el.classList.toggle('selected', isEraser);
if(isEraser) brushSize = 28;
updateCursorPreview();
}

/* ===== CURSOR PREVIEW ===== */
const cursorEl = document.getElementById('cursorPreview');
function updateCursorPreview(){
const s = brushSize * (canvas.clientWidth / canvas.width);
cursorEl.style.width  = s + 'px';
cursorEl.style.height = s + 'px';
cursorEl.style.background = isEraser ? 'rgba(200,200,200,.5)' : currentColor;
}

document.addEventListener('mousemove', e=>{
cursorEl.style.display = 'block';
cursorEl.style.left = e.clientX + 'px';
cursorEl.style.top  = e.clientY + 'px';
});

canvas.addEventListener('mouseleave', ()=>{
cursorEl.style.display = 'none';
});

/* ===== GAMBAR ===== */
function getPos(e){
const rect = canvas.getBoundingClientRect();
const scaleX = canvas.width  / rect.width;
const scaleY = canvas.height / rect.height;
const src = e.touches ? e.touches[0] : e;
return {
x: (src.clientX - rect.left)  * scaleX,
y: (src.clientY - rect.top)   * scaleY
};
}

function startDraw(e){
e.preventDefault();
saveHistory();
isDrawing = true;
const pos = getPos(e);
lastX = pos.x;
lastY = pos.y;
// Titik tunggal
ctx.beginPath();
ctx.arc(lastX, lastY, brushSize/2, 0, Math.PI*2);
ctx.fillStyle = isEraser ? '#ffffff' : currentColor;
ctx.fill();
}

function draw(e){
if(!isDrawing) return;
e.preventDefault();
const pos = getPos(e);
ctx.beginPath();
ctx.moveTo(lastX, lastY);
ctx.lineTo(pos.x, pos.y);
ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
ctx.lineWidth   = brushSize;
ctx.lineCap     = 'round';
ctx.lineJoin    = 'round';
ctx.stroke();
lastX = pos.x;
lastY = pos.y;
}

function endDraw(e){
isDrawing = false;
}

canvas.addEventListener('mousedown',  startDraw);
canvas.addEventListener('mousemove',  draw);
canvas.addEventListener('mouseup',    endDraw);
canvas.addEventListener('mouseleave', endDraw);

canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove',  draw,      {passive:false});
canvas.addEventListener('touchend',   endDraw,   {passive:false});

/* ===== AKSI ===== */
function undoDraw(){
if(history.length > 0){
history.pop();
if(history.length > 0){
ctx.putImageData(history[history.length-1], 0, 0);
} else {
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);
}
}
}

function resetCanvas(){
if(!confirm('Hapus semua gambar?')) return;
history = [];
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function saveDrawing(){
const link = document.createElement('a');
link.download = 'deerbee-coretanku.png';
link.href = canvas.toDataURL('image/png');
link.click();
Sound.correct();
}

function onDone(){
Sound.finish();
burstConfetti();
const nb = Badge.earn('painter');
if(nb) setTimeout(()=>showBadgeToast('painter'), 800);
}

function burstConfetti(){
const box = document.getElementById('confetti');
for(let i=0;i<40;i++){
const p = document.createElement('span');
p.className = 'confetti-piece';
p.style.left = Math.random()*100+'%';
p.style.background = ['#ff69b4','#ffe066','#7ec8f2','#9be7a3','#caa6ff'][Math.floor(Math.random()*5)];
p.style.animationDelay = (Math.random()*.5)+'s';
box.appendChild(p);
}
setTimeout(()=>{ box.innerHTML=''; }, 2500);
}

/* ===== MUSIK ===== */
const audio  = document.getElementById('bgMusic');
const btn    = document.getElementById('musicToggle');
let playing  = false;

function onPlaySuccess(){
btn.textContent    = '🎵';
btn.style.animation = 'none';
playing = true;
}

function startMusic(){
if(!playing) audio.play().then(onPlaySuccess).catch(()=>{});
}

function toggleMusic(){
if(playing){
audio.pause();
btn.textContent    = '🔇';
btn.style.animation = 'musicBounce 1.4s ease-in-out infinite';
playing = false;
localStorage.setItem('deerbee_music','off');
}else{
audio.play().then(onPlaySuccess).catch(()=>{});
localStorage.setItem('deerbee_music','on');
}
}

if(localStorage.getItem('deerbee_music') !== 'off'){
startMusic();
}

/* ===== INIT ===== */
resizeCanvas();
updateCursorPreview();
</script>
</body>
</html>
