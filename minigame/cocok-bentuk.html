<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff69b4">
<link rel="apple-touch-icon" href="/assets/icons/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Cocok Bentuk - DeerBee</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/coloring.css">

<style>
.game-wrap{
max-width:460px;
margin:0 auto;
}

.score-board{
display:flex;
justify-content:center;
gap:14px;
margin-bottom:18px;
}

.score-pill{
background:white;
border-radius:16px;
padding:8px 18px;
font-weight:bold;
font-size:15px;
color:#444;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.score-pill span{
font-size:18px;
margin-right:4px;
}

.question-card{
background:white;
border-radius:22px;
padding:30px 16px 22px;
margin-bottom:22px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
border:4px dashed #ffd1e3;
}

.question-card .label{
color:#999;
font-size:14px;
margin-bottom:14px;
}

.target-box{
width:100px;
height:100px;
margin:0 auto 14px;
display:flex;
align-items:center;
justify-content:center;
}

.target-name{
font-size:22px;
font-weight:bold;
color:#ff69b4;
font-family:'Baloo 2',cursive;
}

.shape-options{
display:flex;
justify-content:center;
gap:16px;
max-width:420px;
margin:0 auto 18px;
flex-wrap:wrap;
}

.shape-box{
width:78px;
height:78px;
border-radius:18px;
background:white;
box-shadow:0 6px 14px rgba(0,0,0,.15);
border:3px solid white;
cursor:pointer;
transition:.2s;
display:flex;
align-items:center;
justify-content:center;
animation:popIn .35s ease backwards;
}

.shape-box:hover{
transform:scale(1.06);
}

.shape-box:active{
transform:scale(0.94);
}

.shape-box.wrong-shake{
animation:shake .4s;
}

.shape-box.correct-pulse{
animation:correctPulse .5s;
}

.shape-inner{
width:74%;
height:74%;
object-fit:contain;
filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));
}

@keyframes popIn{
0%{ transform:scale(0); opacity:0; }
100%{ transform:scale(1); opacity:1; }
}

@keyframes shake{
0%,100%{ transform:translateX(0); }
25%{ transform:translateX(-8px); }
75%{ transform:translateX(8px); }
}

@keyframes correctPulse{
0%{ transform:scale(1); }
50%{ transform:scale(1.15); }
100%{ transform:scale(1); }
}

.game-feedback{
font-size:19px;
font-weight:bold;
min-height:30px;
margin-bottom:14px;
}
</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  });
}
</script>
</head>
<body>

<div class="game-wrap">

<h1>🔺 Cocok Bentuk</h1>
<p class="page-subtitle">Tap bentuk yang sama kayak contohnya</p>

<div class="score-board">
<div class="score-pill"><span>⭐</span><span id="scoreVal">0</span></div>
<div class="score-pill"><span>🔥</span><span id="streakVal">0</span></div>
</div>

<div class="question-card">
<div class="label">Cari yang sama dengan ini:</div>
<div class="target-box" id="targetBox"></div>
<div class="target-name" id="targetName"></div>
</div>

<div class="shape-options" id="options"></div>

<p class="game-feedback" id="feedback"></p>

<button class="icon-btn" onclick="newRound()">
<img src="../assets/icons/btn-acak.png" alt="Soal Baru">
<span>Soal Baru</span>
</button>

<a class="btn-back-icon" href="../minigame.html">
<img src="../assets/icons/btn-back.png" alt="Kembali">
</a>

<div class="confetti-layer" id="confetti"></div>

<audio id="bgMusic" src="../assets/musik/bgm.mp3" loop></audio>
<button id="musicToggle" onclick="toggleMusic()">🔇</button>

<script>
const SHAPES = [
  { id:"lingkaran", name:"Lingkaran", img:"../assets/icons/bentuk/lingkaran.png" },
  { id:"persegi", name:"Persegi", img:"../assets/icons/bentuk/persegi.png" },
  { id:"persegipanjang", name:"Persegi Panjang", img:"../assets/icons/bentuk/persegipanjang.png" },
  { id:"segitiga", name:"Segitiga", img:"../assets/icons/bentuk/segitiga.png" },
  { id:"wajik", name:"Wajik", img:"../assets/icons/bentuk/wajik.png" },
  { id:"bintang", name:"Bintang", img:"../assets/icons/bentuk/bintang.png" },
  { id:"hexagon", name:"Segi Enam", img:"../assets/icons/bentuk/hexagon.png" },
  { id:"oval", name:"Oval", img:"../assets/icons/bentuk/oval.png" },
];


const praiseWords = ["🎉 Hebat!", "👏 Pintar!", "✨ Keren!", "🌟 Betul!", "😄 Asyik!"];
const tryAgainWords = ["Coba lihat lagi bentuknya!", "Hampir, ayo coba lagi!", "Yuk cek lagi bentuknya!"];

let targetShape = null;
let score = 0;
let streak = 0;

function makeShapeEl(shape){
  const el = document.createElement('img');
  el.className = 'shape-inner';
  el.src = shape.img;
  el.alt = shape.name;
  return el;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function newRound(){
  document.getElementById('feedback').textContent = "";

  targetShape = SHAPES[Math.floor(Math.random()*SHAPES.length)];

  const targetBox = document.getElementById('targetBox');
  targetBox.innerHTML = "";
  targetBox.appendChild(makeShapeEl(targetShape));
  document.getElementById('targetName').textContent = targetShape.name;

  // pilih 3 bentuk lain yang berbeda dari target
  const others = shuffle(SHAPES.filter(s=> s.id !== targetShape.id)).slice(0,3);
  const allOptions = shuffle([targetShape, ...others]);

  const optionsBox = document.getElementById('options');
  optionsBox.innerHTML = "";
  allOptions.forEach((shape, idx)=>{
    const box = document.createElement('div');
    box.className = "shape-box";
    box.style.animationDelay = (idx*0.07)+'s';
    box.appendChild(makeShapeEl(shape));
    box.onclick = ()=> checkAnswer(shape, box);
    optionsBox.appendChild(box);
  });
}

function checkAnswer(shape, boxEl){
  const fb = document.getElementById('feedback');
  if(shape.id === targetShape.id){
    score += 10;
    streak += 1;
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('streakVal').textContent = streak;

    fb.textContent = praiseWords[Math.floor(Math.random()*praiseWords.length)];
    fb.style.color = "#2ecc71";
    boxEl.classList.add('correct-pulse');
    burstConfetti();
    Sound.correct();
    const nb = Badge.onBentukBenar();
    if(nb) setTimeout(()=>showBadgeToast(nb), 600);
    setTimeout(newRound, 1100);
  }else{
    streak = 0;
    document.getElementById('streakVal').textContent = streak;
    fb.textContent = tryAgainWords[Math.floor(Math.random()*tryAgainWords.length)];
    fb.style.color = "#ff6b6b";
    boxEl.classList.add('wrong-shake');
    setTimeout(()=> boxEl.classList.remove('wrong-shake'), 400);
  }
}

function burstConfetti(){
  const box = document.getElementById('confetti');
  for(let i=0;i<40;i++){
    const p = document.createElement('span');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'%';
    p.style.background = ['#ff69b4','#ffe066','#7ec8f2','#9be7a3','#caa6ff'][Math.floor(Math.random()*5)];
    p.style.animationDelay = (Math.random()*0.5)+'s';
    box.appendChild(p);
  }
  setTimeout(()=>{ box.innerHTML=''; }, 2500);
}

newRound();

/* ===================== MUSIK ===================== */
const audio = document.getElementById('bgMusic');
const btn = document.getElementById('musicToggle');
let playing = false;

function onPlaySuccess(){
  btn.textContent = '🎵';
  btn.style.animation = 'none';
  playing = true;
}

function startMusic(){
  if(!playing){
    audio.play().then(onPlaySuccess).catch(()=>{});
  }
}

function toggleMusic(){
  if(playing){
    audio.pause();
    btn.textContent = '🔇';
    btn.style.animation = 'musicBounce 1.4s ease-in-out infinite';
    playing = false;
  }else{
    audio.play().then(onPlaySuccess).catch(()=>{});
  }
}

window.addEventListener('load', startMusic);
document.addEventListener('click', startMusic, { once:true });
</script>

</div>

</body>
</html>
