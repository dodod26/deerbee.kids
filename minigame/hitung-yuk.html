<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff69b4">
<link rel="apple-touch-icon" href="/assets/icons/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DeerBee">
<title>Hitung Yuk - DeerBee</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/coloring.css">
<script src="../js/shared.js"></script>
<style>
.game-wrap{
max-width:460px;
margin:0 auto;
}

/* ===== Score board ===== */
.score-board{
display:flex;
justify-content:center;
gap:14px;
margin-bottom:18px;
}

.score-pill{
background:white;
border-radius:16px;
padding:8px 18px;
font-weight:bold;
font-size:15px;
color:#444;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.score-pill span{
font-size:18px;
margin-right:4px;
}

/* ===== Soal ===== */
.question-card{
background:white;
border-radius:22px;
padding:26px 16px;
margin-bottom:22px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
border:4px dashed #ffd1e3;
}

.question-card .label{
color:#999;
font-size:14px;
margin-bottom:10px;
}

.item-row{
display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;
gap:10px;
min-height:70px;
}

.item-emoji{
font-size:48px;
line-height:1;
animation:popIn .35s ease backwards;
}

.number-options{
display:flex;
justify-content:center;
gap:12px;
max-width:400px;
margin:0 auto 18px;
flex-wrap:wrap;
}

.number-box{
width:64px;
height:64px;
border-radius:20px;
cursor:pointer;
box-shadow:0 6px 14px rgba(0,0,0,.18);
border:4px solid white;
transition:.2s;
animation:popIn .35s ease backwards;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
font-family:'Baloo 2',cursive;
color:white;
background:linear-gradient(160deg,#ff8fc6,#ff69b4);
}

.number-box:hover{
transform:scale(1.08);
}

.number-box:active{
transform:scale(0.94);
}

.number-box.wrong-shake{
animation:shake .4s;
}

.number-box.correct-pulse{
animation:correctPulse .5s;
}

@keyframes popIn{
0%{ transform:scale(0); opacity:0; }
100%{ transform:scale(1); opacity:1; }
}

@keyframes shake{
0%,100%{ transform:translateX(0); }
25%{ transform:translateX(-8px); }
75%{ transform:translateX(8px); }
}

@keyframes correctPulse{
0%{ transform:scale(1); }
50%{ transform:scale(1.15); }
100%{ transform:scale(1); }
}

.game-feedback{
font-size:19px;
font-weight:bold;
min-height:30px;
margin-bottom:14px;
}
</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  });
}
</script>
</head>
<body>

<div class="game-wrap">

<h1>🔢 Hitung Yuk!</h1>
<p class="page-subtitle">Tap angka yang sesuai jumlah gambarnya</p>

<div class="score-board">
<div class="score-pill"><span>⭐</span><span id="scoreVal">0</span></div>
<div class="score-pill"><span>🔥</span><span id="streakVal">0</span></div>
</div>

<div class="question-card">
<div class="label">Ada berapa?</div>
<div class="item-row" id="itemRow"></div>
</div>

<div class="number-options" id="options"></div>

<p class="game-feedback" id="feedback"></p>

<button class="icon-btn" onclick="newRound()">
<img src="../assets/icons/btn-acak.png" alt="Soal Baru">
<span>Soal Baru</span>
</button>

<a class="btn-back-icon" href="../minigame.html">
<img src="../assets/icons/btn-back.png" alt="Kembali">
</a>

<div class="confetti-layer" id="confetti"></div>

<audio id="bgMusic" src="../assets/musik/bgm.mp3" loop></audio>
<button id="musicToggle" onclick="toggleMusic()">🔇</button>

<script>
const items = ["🍎","🍌","🍇","🍓","🍊","🍉","🍒","🍍","🐶","🐱","🐰","🐻","🦁","🐸","🐷","🐵"];

const praiseWords = ["🎉 Hebat!", "👏 Pintar!", "✨ Keren!", "🌟 Betul!", "😄 Asyik!"];
const tryAgainWords = ["Coba hitung lagi yuk!", "Hampir, ayo hitung ulang!", "Yuk lihat lagi gambarnya!"];

let target = 0;
let score = 0;
let streak = 0;

function newRound(){
document.getElementById('feedback').textContent = "";

target = Math.floor(Math.random()*5) + 1; // 1 - 5
const chosenItem = items[Math.floor(Math.random()*items.length)];

const itemRow = document.getElementById('itemRow');
itemRow.innerHTML = "";
for(let i=0; i<target; i++){
const span = document.createElement('span');
span.className = 'item-emoji';
span.textContent = chosenItem;
span.style.animationDelay = (i*0.08)+'s';
itemRow.appendChild(span);
}

const optionsBox = document.getElementById('options');
optionsBox.innerHTML = "";
for(let n=1; n<=5; n++){
const box = document.createElement('div');
box.className = "number-box";
box.textContent = n;
box.style.animationDelay = ((n-1)*0.06)+'s';
box.onclick = ()=> checkAnswer(n, box);
optionsBox.appendChild(box);
}
}

function checkAnswer(n, boxEl){
const fb = document.getElementById('feedback');
if(n === target){
score += 10;
streak += 1;
document.getElementById('scoreVal').textContent = score;
document.getElementById('streakVal').textContent = streak;

fb.textContent = praiseWords[Math.floor(Math.random()*praiseWords.length)];
fb.style.color = "#2ecc71";
boxEl.classList.add('correct-pulse');
burstConfetti();
Sound.correct();
const nb = Badge.onHitungBenar();
if(nb) setTimeout(()=>showBadgeToast(nb), 600);
setTimeout(newRound, 1100);
}else{
streak = 0;
document.getElementById('streakVal').textContent = streak;
fb.textContent = tryAgainWords[Math.floor(Math.random()*tryAgainWords.length)];
fb.style.color = "#ff6b6b";
boxEl.classList.add('wrong-shake');
setTimeout(()=> boxEl.classList.remove('wrong-shake'), 400);
}
}

function burstConfetti(){
const box = document.getElementById('confetti');
for(let i=0;i<40;i++){
const p = document.createElement('span');
p.className = 'confetti-piece';
p.style.left = Math.random()*100+'%';
p.style.background = ['#ff69b4','#ffe066','#7ec8f2','#9be7a3','#caa6ff'][Math.floor(Math.random()*5)];
p.style.animationDelay = (Math.random()*0.5)+'s';
box.appendChild(p);
}
setTimeout(()=>{ box.innerHTML=''; }, 2500);
}

newRound();

/* ===================== MUSIK ===================== */
const audio = document.getElementById('bgMusic');
const btn = document.getElementById('musicToggle');
let playing = false;

function onPlaySuccess(){
btn.textContent = '🎵';
btn.style.animation = 'none';
playing = true;
}

function startMusic(){
if(!playing){
audio.play().then(onPlaySuccess).catch(()=>{});
}
}

function toggleMusic(){
if(playing){
audio.pause();
btn.textContent = '🔇';
btn.style.animation = 'musicBounce 1.4s ease-in-out infinite';
playing = false;
}else{
audio.play().then(onPlaySuccess).catch(()=>{});
}
}

window.addEventListener('load', startMusic);
document.addEventListener('click', startMusic, { once:true });
</script>

</div>

</body>
</html>
