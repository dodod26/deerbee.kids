<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hewan & Makanannya - DeerBee</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/coloring.css">
<script src="../js/shared.js"></script>
<style>
.game-wrap{
max-width:460px;
margin:0 auto;
}

.score-board{
display:flex;
justify-content:center;
gap:14px;
margin-bottom:18px;
}

.score-pill{
background:white;
border-radius:16px;
padding:8px 18px;
font-weight:bold;
font-size:15px;
color:#444;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.score-pill span{
font-size:18px;
margin-right:4px;
}

.question-card{
background:white;
border-radius:22px;
padding:26px 16px 22px;
margin-bottom:22px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
border:4px dashed #ffd1e3;
}

.question-card .label{
color:#999;
font-size:14px;
margin-bottom:10px;
}

.target-animal{
width:110px;
height:110px;
margin:0 auto 8px;
display:flex;
align-items:center;
justify-content:center;
animation:popIn .35s ease backwards;
}

.target-img{
width:100%;
height:100%;
object-fit:contain;
filter:drop-shadow(0 3px 5px rgba(0,0,0,.15));
}

.target-name{
font-size:22px;
font-weight:bold;
color:#ff69b4;
font-family:'Baloo 2',cursive;
}

.food-options{
display:flex;
justify-content:center;
gap:14px;
max-width:420px;
margin:0 auto 18px;
flex-wrap:wrap;
}

.food-box{
width:88px;
padding:12px 6px 10px;
border-radius:18px;
background:white;
box-shadow:0 6px 14px rgba(0,0,0,.15);
border:3px solid white;
cursor:pointer;
transition:.2s;
animation:popIn .35s ease backwards;
text-align:center;
}

.food-box:hover{
transform:scale(1.06);
}

.food-box:active{
transform:scale(0.94);
}

.food-box.wrong-shake{
animation:shake .4s;
}

.food-box.correct-pulse{
animation:correctPulse .5s;
}

.food-img{
width:100%;
height:56px;
object-fit:contain;
display:block;
margin-bottom:4px;
filter:drop-shadow(0 2px 4px rgba(0,0,0,.15));
}

.food-label{
font-size:12px;
font-weight:bold;
color:#555;
}

@keyframes popIn{
0%{ transform:scale(0); opacity:0; }
100%{ transform:scale(1); opacity:1; }
}

@keyframes shake{
0%,100%{ transform:translateX(0); }
25%{ transform:translateX(-8px); }
75%{ transform:translateX(8px); }
}

@keyframes correctPulse{
0%{ transform:scale(1); }
50%{ transform:scale(1.15); }
100%{ transform:scale(1); }
}

.game-feedback{
font-size:19px;
font-weight:bold;
min-height:30px;
margin-bottom:14px;
}
</style>
</head>
<body>

<div class="game-wrap">

<h1>🍽️ Hewan & Makanannya</h1>
<p class="page-subtitle">Tap makanan kesukaan hewannya</p>

<div class="score-board">
<div class="score-pill"><span>⭐</span><span id="scoreVal">0</span></div>
<div class="score-pill"><span>🔥</span><span id="streakVal">0</span></div>
</div>

<div class="question-card">
<div class="label">Makanan kesukaannya apa ya?</div>
<div class="target-animal" id="targetAnimal"></div>
<div class="target-name" id="targetName"></div>
</div>

<div class="food-options" id="options"></div>

<p class="game-feedback" id="feedback"></p>

<button class="icon-btn" onclick="newRound()">
<img src="../assets/icons/btn-acak.png" alt="Soal Baru">
<span>Soal Baru</span>
</button>

<a class="btn-back-icon" href="../minigame.html">
<img src="../assets/icons/btn-back.png" alt="Kembali">
</a>

<div class="confetti-layer" id="confetti"></div>

<audio id="bgMusic" src="../assets/musik/bgm.mp3" loop></audio>
<button id="musicToggle" onclick="toggleMusic()">🔇</button>

<script>
const PAIRS = [
  { animal:"../assets/icons/hewan-makanan/kelinci.png", animalName:"Kelinci", food:"../assets/icons/hewan-makanan/wortel.png", foodName:"Wortel" },
  { animal:"../assets/icons/hewan-makanan/kucing.png",  animalName:"Kucing",  food:"../assets/icons/hewan-makanan/ikan.png", foodName:"Ikan" },
  { animal:"../assets/icons/hewan-makanan/sapi.png",    animalName:"Sapi",    food:"../assets/icons/hewan-makanan/rumput.png", foodName:"Rumput" },
  { animal:"../assets/icons/hewan-makanan/monyet.png",  animalName:"Monyet",  food:"../assets/icons/hewan-makanan/pisang.png", foodName:"Pisang" },
  { animal:"../assets/icons/hewan-makanan/beruang.png", animalName:"Beruang", food:"../assets/icons/hewan-makanan/madu.png", foodName:"Madu" },
  { animal:"../assets/icons/hewan-makanan/panda.png",   animalName:"Panda",   food:"../assets/icons/hewan-makanan/bambu.png", foodName:"Bambu" },
  { animal:"../assets/icons/hewan-makanan/tikus.png",   animalName:"Tikus",   food:"../assets/icons/hewan-makanan/keju.png", foodName:"Keju" },
  { animal:"../assets/icons/hewan-makanan/burung.png",  animalName:"Burung",  food:"../assets/icons/hewan-makanan/cacing.png", foodName:"Cacing" },
  { animal:"../assets/icons/hewan-makanan/gajah.png",   animalName:"Gajah",   food:"../assets/icons/hewan-makanan/kacang.png", foodName:"Kacang" },
  { animal:"../assets/icons/hewan-makanan/ayam.png",    animalName:"Ayam",    food:"../assets/icons/hewan-makanan/jagung.png", foodName:"Jagung" },
];

const praiseWords = ["🎉 Hebat!", "👏 Pintar!", "✨ Keren!", "🌟 Betul!", "😄 Asyik!"];
const tryAgainWords = ["Coba tebak lagi yuk!", "Hampir, ayo coba lagi!", "Yuk pikir lagi makanannya!"];

let targetPair = null;
let score = 0;
let streak = 0;

function shuffle(arr){
const a = [...arr];
for(let i=a.length-1; i>0; i--){
const j = Math.floor(Math.random()*(i+1));
[a[i],a[j]] = [a[j],a[i]];
}
return a;
}

function newRound(){
document.getElementById('feedback').textContent = "";

targetPair = PAIRS[Math.floor(Math.random()*PAIRS.length)];

document.getElementById('targetAnimal').innerHTML = `<img src="${targetPair.animal}" alt="${targetPair.animalName}" class="target-img">`;
document.getElementById('targetName').textContent = targetPair.animalName;

const others = shuffle(PAIRS.filter(p=> p.food !== targetPair.food)).slice(0,3);
const allOptions = shuffle([targetPair, ...others]);

const optionsBox = document.getElementById('options');
optionsBox.innerHTML = "";
allOptions.forEach((pair, idx)=>{
const box = document.createElement('div');
box.className = "food-box";
box.style.animationDelay = (idx*0.07)+'s';
box.innerHTML = `<img src="${pair.food}" alt="${pair.foodName}" class="food-img"><span class="food-label">${pair.foodName}</span>`;
box.onclick = ()=> checkAnswer(pair, box);
optionsBox.appendChild(box);
});
}

function checkAnswer(pair, boxEl){
const fb = document.getElementById('feedback');
if(pair.food === targetPair.food){
score += 10;
streak += 1;
document.getElementById('scoreVal').textContent = score;
document.getElementById('streakVal').textContent = streak;

fb.textContent = praiseWords[Math.floor(Math.random()*praiseWords.length)];
fb.style.color = "#2ecc71";
boxEl.classList.add('correct-pulse');
burstConfetti();
Sound.correct();
const nb = Badge.onHewanBenar();
if(nb) setTimeout(()=>showBadgeToast(nb), 600);
setTimeout(newRound, 1100);
}else{
streak = 0;
document.getElementById('streakVal').textContent = streak;
fb.textContent = tryAgainWords[Math.floor(Math.random()*tryAgainWords.length)];
fb.style.color = "#ff6b6b";
boxEl.classList.add('wrong-shake');
setTimeout(()=> boxEl.classList.remove('wrong-shake'), 400);
}
}

function burstConfetti(){
const box = document.getElementById('confetti');
for(let i=0;i<40;i++){
const p = document.createElement('span');
p.className = 'confetti-piece';
p.style.left = Math.random()*100+'%';
p.style.background = ['#ff69b4','#ffe066','#7ec8f2','#9be7a3','#caa6ff'][Math.floor(Math.random()*5)];
p.style.animationDelay = (Math.random()*0.5)+'s';
box.appendChild(p);
}
setTimeout(()=>{ box.innerHTML=''; }, 2500);
}

newRound();

/* ===================== MUSIK ===================== */
const audio = document.getElementById('bgMusic');
const btn = document.getElementById('musicToggle');
let playing = false;

function onPlaySuccess(){
btn.textContent = '🎵';
btn.style.animation = 'none';
playing = true;
}

function startMusic(){
if(!playing){
audio.play().then(onPlaySuccess).catch(()=>{});
}
}

function toggleMusic(){
if(playing){
audio.pause();
btn.textContent = '🔇';
btn.style.animation = 'musicBounce 1.4s ease-in-out infinite';
playing = false;
}else{
audio.play().then(onPlaySuccess).catch(()=>{});
}
}

window.addEventListener('load', startMusic);
document.addEventListener('click', startMusic, { once:true });
</script>

</div>

</body>
</html>
